name: Fix LIGERA checkout button
on:
  push:
    paths:
      - '.github/workflows/fix-kiwify-checkout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blocking click handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = ' onclick="alert(\'Configura aquí el enlace real de tu checkout antes de publicar.\');return false;"'
          assert s.count(original) == 1, 'Expected exact blocker not found'
          s = s.replace(original, '')
          s = s.replace('Configura tu enlace de pago antes de publicar la página.', 'Pago seguro a través de Kiwify.')
          assert 'href="https://pay.kiwify.com/KnAUyRX"' in s
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Kiwify checkout purchase button"
          git push
